<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oncology Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF8FF;--card:#fff;--tx:#2B2A3A;--mu:#6B6A80;--ln:#E8E4F3;--pu:#7A68C4;--pubg:#EDE8FB;--ye:#7A5B00;--yebg:#FFF4C7;--gr:#2D6A45;--grbg:#DDF3E4;--bl:#245F8A;--blbg:#DCEEFB;--pk:#A3405A;--pkbg:#FBE3EA;--s1:#EFEAFB;--s2:#E1F1FB;--on:#fff;--em:#C8374B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17151F;--card:#201E2B;--tx:#ECEAF5;--mu:#A5A2BC;--ln:#343148;--pu:#B3A5F0;--pubg:#2E2946;--ye:#F0D77A;--yebg:#3A3314;--gr:#8AD9A8;--grbg:#17331F;--bl:#8CC6EE;--blbg:#16303F;--pk:#EE9DB2;--pkbg:#3B1F29;--s1:#242035;--s2:#1B2A36;--on:#17151F}}
:root[data-theme="dark"]{--bg:#17151F;--card:#201E2B;--tx:#ECEAF5;--mu:#A5A2BC;--ln:#343148;--pu:#B3A5F0;--pubg:#2E2946;--ye:#F0D77A;--yebg:#3A3314;--gr:#8AD9A8;--grbg:#17331F;--bl:#8CC6EE;--blbg:#16303F;--pk:#EE9DB2;--pkbg:#3B1F29;--s1:#242035;--s2:#1B2A36;--on:#17151F}
*{box-sizing:border-box}html,body{height:100%;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:400 15px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
button,input,select,textarea{font:inherit;color:inherit}h1,h2,h3{margin:0;line-height:1.2}h2{font-size:18px}h3{font-size:16px}
:focus-visible{outline:2px solid var(--pu);outline-offset:2px}.hide{display:none!important}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--ln);border-radius:10px;background:var(--bg)}
textarea{min-height:76px;resize:vertical}label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}
.btn{background:var(--pu);color:var(--on);border:0;border-radius:10px;padding:9px 15px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--ln)}.btn.danger{background:var(--pkbg);color:var(--pk)}
.btn.em{background:var(--em);color:#fff}.btn.sm{padding:5px 11px;font-size:13px}
.lnk{background:none;border:0;color:var(--pu);font-weight:600;cursor:pointer;padding:0 2px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
#login{min-height:100%;display:grid;place-items:center;padding:24px;background:linear-gradient(150deg,var(--s1),var(--s2) 60%,var(--yebg))}
.lcard{background:var(--card);border-radius:18px;padding:30px;width:100%;max-width:400px}
.brand{font-size:22px;font-weight:700;letter-spacing:-.01em;color:var(--pu)}.sub{color:var(--mu);margin:4px 0 14px}
.err{color:var(--pk);font-size:13px;min-height:18px;margin-top:8px}.hint{color:var(--mu);font-size:13px}
#app{display:grid;grid-template-columns:228px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,var(--s1),var(--s2));padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
aside .brand{padding:0 10px 16px}
.nav{display:flex;align-items:center;gap:10px;background:none;border:0;padding:10px;border-radius:10px;cursor:pointer;width:100%;text-align:left;color:var(--tx)}
.nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav.on{background:var(--card);color:var(--pu);font-weight:600}
.sidecd{margin-top:auto;background:var(--card);border-radius:12px;padding:12px}.sidecd small{display:block;color:var(--mu)}
.sidecd b{font-size:22px;font-variant-numeric:tabular-nums}
main{padding:20px 28px 40px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:24px}.top p{margin:2px 0 0;color:var(--mu)}
.alert{background:var(--em);color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:8px;z-index:30}
.alert .row{margin:0}.alert button{background:#fff;color:var(--em);border:0;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer}
.alert small{opacity:.9}
@media(prefers-reduced-motion:no-preference){.alert{animation:pl 1.6s ease-in-out infinite}@keyframes pl{50%{box-shadow:0 0 0 5px rgba(200,55,75,.3)}}.bar i{transition:width .6s}}
.strip{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;margin:8px 0 20px}
.pc{flex:0 0 190px;text-align:left;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.pc.on{border-color:var(--pu);box-shadow:0 0 0 2px var(--pu)}.pc span{color:var(--mu);font-size:13px}.pc.add{align-items:center;justify-content:center;color:var(--pu);font-weight:600;border-style:dashed}
.chip{display:inline-block;font-style:normal;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;margin-top:6px;align-self:flex-start}
.chip.gr{background:var(--grbg);color:var(--gr)}.chip.ye{background:var(--yebg);color:var(--ye)}.chip.bl{background:var(--blbg);color:var(--bl)}.chip.pk{background:var(--pkbg);color:var(--pk)}.chip.pu{background:var(--pubg);color:var(--pu)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.panel{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px}
.panel.ye{background:var(--yebg)}.panel.bl{background:var(--blbg)}.panel.pk{background:var(--pkbg)}.panel.gr{background:var(--grbg)}.panel.pu{background:var(--pubg)}
.panel header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.panel header span{color:var(--mu);font-size:13px}
.entry{border-top:1px solid rgba(120,110,160,.2);padding:10px 0}.entry .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-bottom:2px}.entry .meta .chip{margin:0}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid rgba(120,110,160,.2)}.task input{width:18px;height:18px;margin-top:3px;accent-color:var(--pu)}
.task.done .t{text-decoration:line-through;color:var(--mu)}.task small{display:block;color:var(--mu)}.task>div{flex:1}
.empty{color:var(--mu);padding:10px 0}
.split{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}.plist{display:flex;flex-direction:column;gap:8px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0}.facts dt{font-size:12px;color:var(--mu);font-weight:600}.facts dd{margin:2px 0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin:8px 0 16px}
.tile{background:var(--pubg);border-radius:12px;padding:10px}.tile small{color:var(--mu);display:block}.tile b{font-size:19px}.tile.f{background:var(--yebg)}.tile.f b{color:var(--ye)}
.med{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid var(--ln);padding:8px 0}.med .chip{margin:0}
.avatar{width:68px;height:68px;border-radius:50%;background:var(--pubg);color:var(--pu);display:grid;place-items:center;font-size:24px;font-weight:700}
.big{font-size:42px;font-weight:700;font-variant-numeric:tabular-nums}.bar{height:10px;border-radius:99px;background:var(--ln);overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;background:var(--pu);width:0}
.tags{display:flex;gap:8px;flex-wrap:wrap}.log{font-size:13px;color:var(--mu);border-top:1px solid var(--ln);padding:6px 0}
#modal{position:fixed;inset:0;background:rgba(30,25,50,.45);display:grid;place-items:center;padding:16px;z-index:70;overflow:auto}
.dlg{background:var(--card);border-radius:18px;padding:22px;width:100%;max-width:440px;max-height:100%;overflow:auto}
@media(max-width:820px){#app{grid-template-columns:1fr}
aside{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:20;justify-content:space-around;gap:2px}
aside .brand,.sidecd{display:none}.nav{flex-direction:column;gap:2px;font-size:12px;align-items:center;justify-content:center;text-align:center}
main{padding:14px 14px 100px}.split{grid-template-columns:1fr}.plist{flex-direction:row;overflow-x:auto}.plist .pc{flex:0 0 170px}}
</style>
</head>
<body>
<section id="login"><div class="lcard">
<div class="brand">Oncology Dashboard</div><p class="sub">Sign in to start your shift</p>
<label for="em">Username or email</label><input id="em" autocomplete="username" placeholder="pnair">
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
<label for="un">Unit</label><select id="un"><option>4 West Inpatient Oncology</option><option>Infusion Suite</option><option>Outpatient Clinic</option></select>
<div class="err" id="err" role="alert"></div>
<div class="row"><button class="btn" style="width:100%" data-act="login">Sign in</button></div>
<p class="hint">Prototype: any username and password works. All patients are fictional.</p>
</div></section>
<div id="app" class="hide">
<aside><div class="brand">Oncology Dashboard</div>
<button class="nav on" data-act="nav" data-v="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
<button class="nav" data-act="nav" data-v="patients"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.3c2 .7 3.5 2.6 3.5 5.7"/></svg>Patient list</button>
<button class="nav" data-act="nav" data-v="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Nurse profile</button>
<button class="nav" data-act="nav" data-v="alerts"><svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>Alerts</button>
<div class="sidecd"><small data-cdl>Shift ends in</small><b data-cd>0:00:00</b></div></aside>
<main><div id="ban"></div><div id="view"></div></main>
</div>
<div id="modal" class="hide"></div>
<script>
let U=100;const id=()=>++U,$=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ST={"Stable":"gr","Infusing":"bl","Pre-meds due":"bl","Neutropenic precautions":"ye","Fever watch":"pk","Discharge planning":"pu"};
const SH={"Day (07:00–19:30)":["07:00","19:30"],"Night (19:00–07:30)":["19:00","07:30"],"Early (06:00–14:30)":["06:00","14:30"],"Mid (11:00–23:30)":["11:00","23:30"],"Evening (14:00–22:30)":["14:00","22:30"],"Weekend day (08:00–20:30)":["08:00","20:30"],"Custom":null};
const MOODS=["Anxious","Hopeful","Tired","Withdrawn","Calm","Grieving"],AT=["Code Blue","Rapid response","Fire","Security","Patient fall","Chemo spill","Other"];
const m=(n,dose,route,freq,s="Active")=>({id:id(),n,dose,route,freq,s});
const now=()=>{const d=new Date();return d.toLocaleDateString()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const tm=()=>now().split(" ")[1],iso=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const P=[
{id:1,name:"Marguerite A.",bed:"Bed 4A",age:62,dx:"Breast cancer, stage III",rx:"AC-T, cycle 3 day 1",al:"Sulfa drugs",code:"Full code",st:"Neutropenic precautions",due:"Doxorubicin at 10:30",v:{t:"37.4",hr:"92",bp:"118/74",sp:"97"},l:{anc:"1.1",hgb:"10.2",plt:"148"},meds:[m("Doxorubicin","60 mg/m²","IV","Day 1 of 21"),m("Ondansetron","8 mg","PO","Every 8 h"),m("Filgrastim","300 mcg","SC","Daily")],log:[]},
{id:2,name:"Dev P.",bed:"Bed 4B",age:54,dx:"Colon cancer, stage III",rx:"FOLFOX, cycle 5",al:"None known",code:"Full code",st:"Infusing",due:"Oxaliplatin ends 12:15",v:{t:"36.8",hr:"78",bp:"126/80",sp:"98"},l:{anc:"2.4",hgb:"11.8",plt:"201"},meds:[m("Oxaliplatin","85 mg/m²","IV","Every 14 days"),m("Leucovorin","400 mg/m²","IV","Every 14 days")],log:[]},
{id:3,name:"Ruth O.",bed:"Bed 5A",age:71,dx:"Multiple myeloma",rx:"Daratumumab, week 4",al:"Penicillin (rash)",code:"DNR",st:"Pre-meds due",due:"Pre-meds at 09:45",v:{t:"36.6",hr:"70",bp:"142/84",sp:"96"},l:{anc:"3.0",hgb:"9.4",plt:"176"},meds:[m("Daratumumab","16 mg/kg","IV","Weekly"),m("Acetaminophen","650 mg","PO","Pre-infusion")],log:[]},
{id:4,name:"Tomás R.",bed:"Bed 5B",age:38,dx:"AML, induction day 9",rx:"7+3 regimen",al:"None known",code:"Full code",st:"Fever watch",due:"Cultures and antibiotics review",v:{t:"38.1",hr:"104",bp:"108/66",sp:"95"},l:{anc:"0.2",hgb:"8.1",plt:"22"},meds:[m("Cefepime","2 g","IV","Every 8 h"),m("Cytarabine","100 mg/m²","IV","Continuous","On hold")],log:[]},
{id:5,name:"Helen W.",bed:"Bed 6A",age:67,dx:"Lung adenocarcinoma",rx:"Pembrolizumab, cycle 6",al:"Latex",code:"Full code",st:"Stable",due:"Thyroid labs at 14:00",v:{t:"36.7",hr:"74",bp:"130/78",sp:"97"},l:{anc:"4.1",hgb:"12.0",plt:"254"},meds:[m("Pembrolizumab","200 mg","IV","Every 21 days")],log:[]}];
const S={v:"home",sel:null,pid:1,nd:iso(),
me:{name:"Priya Nair",user:"pnair",role:"Staff nurse, RN",unit:"4 West Inpatient Oncology",phone:"Ext. 4127",exp:"7 years in oncology",certs:[{id:id(),n:"Oncology Certified Nurse (OCN)",exp:"2027-03-31"},{id:id(),n:"Chemotherapy and biotherapy",exp:"2026-12-15"},{id:id(),n:"BLS",exp:"2027-08-01"}],notes:{}},
sh:{type:"Day (07:00–19:30)",s:"07:00",e:"19:30"},
clin:[{id:id(),p:4,t:"06:50",a:"N. Okafor",x:"Temp 38.1 °C at 06:30. Blood cultures drawn, antibiotics given at 06:55. Reassess vitals hourly."},{id:id(),p:1,t:"06:40",a:"N. Okafor",x:"Neutropenic precautions in place. Mouth care done. Port site clean and dry."},{id:id(),p:0,t:"06:00",a:"N. Okafor",x:"Pharmacy delay on 4B oxaliplatin, now confirmed for 08:30."}],
emo:[{id:id(),p:4,m:"Anxious",t:"06:45",a:"N. Okafor",x:"Tomás asked if the fever means he is getting worse. His partner arrives at 10:00. Wants the doctor to explain in plain words."},{id:id(),p:3,m:"Hopeful",t:"06:20",a:"N. Okafor",x:"Ruth is looking forward to her granddaughter’s visit on Saturday. Likes the blind half open."}],
tasks:[{id:id(),p:4,x:"Hourly vitals and fever chart",d:"Every hour",c:0},{id:id(),p:3,x:"Give pre-meds before daratumumab",d:"09:45",c:0},{id:id(),p:1,x:"Doxorubicin double-check with second RN",d:"10:15",c:0},{id:id(),p:5,x:"Thyroid labs",d:"14:00",c:0},{id:id(),p:0,x:"Restock chemo spill kit",d:"Before 12:00",c:1}],
al:[]};
const nm=i=>{if(!i)return"Whole unit";const q=P.find(p=>p.id==i);return q?q.name:"Former patient"};
const pO=()=>[[0,"Whole unit"]].concat(P.map(p=>[p.id,p.name]));
const au=()=>{const w=S.me.name.split(" ");return w.length>1?w[0][0]+". "+w.slice(1).join(" "):w[0]};
const logP=(p,x)=>p.log.unshift({t:now(),x});
const lab=fs=>Object.fromEntries(fs.map(f=>[f.k,f.l]));
function apply(obj,o,fs,p){const L=lab(fs),ch=[];for(const k in o){const nv=k=="age"?+o[k]:o[k];if(String(obj[k])!=String(nv)){ch.push(`${L[k]}: ${obj[k]} → ${nv}`);obj[k]=nv}}if(ch.length)logP(p,ch.join("; "))}
function shift(){const n=new Date(),[a,b]=S.sh.s.split(":"),[c,d]=S.sh.e.split(":");let s=new Date(n),e=new Date(n);s.setHours(+a,+b,0,0);e.setHours(+c,+d,0,0);
if(e<=s){if(n<e)s.setDate(s.getDate()-1);else e.setDate(e.getDate()+1)}
if(n>=s&&n<e)return{k:"Shift ends in",ms:e-n,pct:(n-s)/(e-s)*100};if(n<s)return{k:"Shift starts in",ms:s-n,pct:0};s.setDate(s.getDate()+1);return{k:"Next shift starts in",ms:s-n,pct:100}}
const fmt=ms=>{const t=Math.floor(ms/1000);return Math.floor(t/3600)+":"+String(Math.floor(t%3600/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0")};
function tick(){const s=shift();document.querySelectorAll("[data-cd]").forEach(e=>e.textContent=fmt(s.ms));document.querySelectorAll("[data-cdl]").forEach(e=>e.textContent=s.k);document.querySelectorAll("[data-bar]").forEach(e=>e.style.width=s.pct+"%")}
/* modal */
let M=null;
function form(title,fs,save,del,o={}){M={title,fs,save,del,...o};drawM()}
function drawM(){const el=$("#modal");if(!M){el.classList.add("hide");el.innerHTML="";return}el.classList.remove("hide");
el.innerHTML=`<div class="dlg" role="dialog" aria-modal="true"><h2>${esc(M.title)}</h2>${M.msg?`<p>${esc(M.msg)}</p>`:""}${M.fs.map(f=>`<label for="f_${f.k}">${f.l}</label>`+(f.t=="area"?`<textarea id="f_${f.k}">${esc(f.v)}</textarea>`:f.t=="sel"?`<select id="f_${f.k}">${f.o.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return`<option value="${esc(v)}"${String(v)==String(f.v)?" selected":""}>${esc(l)}</option>`}).join("")}</select>`:`<input id="f_${f.k}" type="${f.t||"text"}" value="${esc(f.v)}">`)).join("")}<div class="err" id="merr" role="alert"></div><div class="row">${M.save?'<button class="btn" data-act="msave">Save</button>':""}<button class="btn ghost" data-act="mcancel">Cancel</button>${M.del?`<button class="btn danger" data-act="mdel">${M.dl||"Delete"}</button>`:""}</div></div>`;
const f=el.querySelector("input,textarea,select");if(f)f.focus()}
function closeM(){M=null;drawM();draw()}
/* forms */
const PF=p=>[{k:"name",l:"Name",v:p.name},{k:"age",l:"Age",t:"number",v:p.age},{k:"dx",l:"Diagnosis",v:p.dx},{k:"rx",l:"Regimen",v:p.rx},{k:"al",l:"Allergies",v:p.al},{k:"code",l:"Code status",t:"sel",o:["Full code","DNR","DNR/DNI"],v:p.code},{k:"st",l:"Status",t:"sel",o:Object.keys(ST),v:p.st},{k:"due",l:"Next due",v:p.due}];
const VF=p=>[{k:"t",l:"Temp (°C)",v:p.v.t},{k:"hr",l:"Heart rate",v:p.v.hr},{k:"bp",l:"Blood pressure",v:p.v.bp},{k:"sp",l:"SpO₂ (%)",v:p.v.sp},{k:"anc",l:"ANC",v:p.l.anc},{k:"hgb",l:"Hgb",v:p.l.hgb},{k:"plt",l:"Platelets",v:p.l.plt}];
function editP(p){const fs=PF(p);form("Edit "+p.name,fs,o=>{if(!o.name)return"Name is required.";apply(p,o,fs,p)})}
function addP(){const b={name:"",age:"",dx:"",rx:"",al:"None known",code:"Full code",st:"Stable",due:""},fs=[{k:"bed",l:"Room or bed",v:""}].concat(PF(b));
form("Add patient",fs,o=>{if(!o.name||!o.bed)return"Name and room are required.";const p={id:id(),...o,age:+o.age||0,v:{t:"",hr:"",bp:"",sp:""},l:{anc:"",hgb:"",plt:""},meds:[],log:[]};logP(p,"Admitted to "+o.bed);P.push(p);S.pid=p.id})}
function vitals(p){const fs=VF(p),L=lab(fs);form("Vitals and labs, "+p.name,fs,o=>{const ch=[];for(const k in o){const g=["anc","hgb","plt"].includes(k)?p.l:p.v;if(g[k]!=o[k]){ch.push(`${L[k]}: ${g[k]||"–"} → ${o[k]||"–"}`);g[k]=o[k]}}if(ch.length)logP(p,"Updated "+ch.join("; "))})}
function moveP(p){form("Move room, "+p.name,[{k:"bed",l:"New room or bed",v:p.bed},{k:"why",l:"Reason",t:"sel",o:["Isolation needed","Closer to nurses’ station","Bed unavailable","Patient request","Discharge prep","Other"],v:"Other"}],o=>{if(!o.bed)return"Enter a room.";if(o.bed!=p.bed){logP(p,`Room: ${p.bed} → ${o.bed} (${o.why})`);p.bed=o.bed}})}
function delP(p){form("Remove "+p.name+"?",[],null,()=>{const i=P.indexOf(p);P.splice(i,1);S.pid=P[0]?P[0].id:0;if(S.sel==p.id)S.sel=null},{dl:"Remove patient",msg:"This removes the patient, medications and change log from your list. Notes stay but show “Former patient”."})}
function medF(p,md){const e=!!md,n=md||{n:"",dose:"",route:"IV",freq:"",s:"Active"},fs=[{k:"n",l:"Medication",v:n.n},{k:"dose",l:"Dose",v:n.dose},{k:"route",l:"Route",t:"sel",o:["IV","PO","SC","IM","Intrathecal","Topical"],v:n.route},{k:"freq",l:"Frequency",v:n.freq},{k:"s",l:"Status",t:"sel",o:["Active","On hold","Stopped"],v:n.s},{k:"why",l:"Reason for change",v:""}];
form((e?"Change ":"Add ")+(e?n.n:"medication"),fs,o=>{if(!o.n)return"Medication name is required.";const w=o.why?` (${o.why})`:"";if(!e){p.meds.push({id:id(),n:o.n,dose:o.dose,route:o.route,freq:o.freq,s:o.s});logP(p,`Started ${o.n} ${o.dose} ${o.route} ${o.freq}${w}`)}else{const ch=[];for(const k of["n","dose","route","freq","s"])if(md[k]!=o[k]){ch.push(`${fs.find(f=>f.k==k).l}: ${md[k]} → ${o[k]}`);md[k]=o[k]}if(ch.length)logP(p,`${n.n}: ${ch.join("; ")}${w}`)}},e&&(()=>{p.meds=p.meds.filter(z=>z!==md);logP(p,"Removed "+md.n+" from list")}),{dl:"Remove medication"})}
function noteF(k,e){const emo=k=="emo",n=e||{p:S.sel||0,t:tm(),m:"Calm",x:""};
const fs=[{k:"p",l:"Patient",t:"sel",o:pO(),v:n.p},{k:"t",l:"Time",t:"time",v:n.t}].concat(emo?[{k:"m",l:"Mood",t:"sel",o:MOODS,v:n.m}]:[],[{k:"x",l:emo?"What matters to them":"Clinical note",t:"area",v:n.x}]);
form((e?"Edit ":"Add ")+(emo?"emotional":"clinical")+" note",fs,o=>{if(!o.x)return"Write a note first.";const d={p:+o.p,t:o.t||tm(),x:o.x};if(emo)d.m=o.m;if(e)Object.assign(e,d,{ed:1});else S[k].unshift({id:id(),a:au(),...d})},e&&(()=>{S[k]=S[k].filter(z=>z!==e)}))}
function taskF(e){const n=e||{p:S.sel||0,x:"",d:"",c:0};form((e?"Edit":"Add")+" task",[{k:"x",l:"Task",v:n.x},{k:"p",l:"Patient",t:"sel",o:pO(),v:n.p},{k:"d",l:"Due",v:n.d}],o=>{if(!o.x)return"Describe the task.";const d={p:+o.p,x:o.x,d:o.d||"No time set"};if(e)Object.assign(e,d);else S.tasks.push({id:id(),c:0,...d})},e&&(()=>{S.tasks=S.tasks.filter(z=>z!==e)}))}
function meF(){const fs=[["name","Full name"],["user","Username"],["role","Role"],["unit","Unit"],["phone","Phone or extension"],["exp","Experience"]].map(([k,l])=>({k,l,v:S.me[k]}));form("Edit profile",fs,o=>{if(!o.name||!o.user)return"Name and username are required.";Object.assign(S.me,o)})}
function certF(c){const n=c||{n:"",exp:""};form((c?"Edit":"Add")+" certificate",[{k:"n",l:"Certificate",v:n.n},{k:"exp",l:"Expires",t:"date",v:n.exp}],o=>{if(!o.n)return"Enter a certificate name.";if(c)Object.assign(c,o);else S.me.certs.push({id:id(),...o})},c&&(()=>{S.me.certs=S.me.certs.filter(z=>z!==c)}))}
function shiftF(){form("Change shift",[{k:"type",l:"Shift pattern",t:"sel",o:Object.keys(SH),v:S.sh.type},{k:"s",l:"Custom start (Custom only)",t:"time",v:S.sh.s},{k:"e",l:"Custom end (Custom only)",t:"time",v:S.sh.e}],o=>{const p=SH[o.type];if(!p&&(!o.s||!o.e))return"Enter start and end times.";S.sh={type:o.type,s:p?p[0]:o.s,e:p?p[1]:o.e}})}
function alertF(a){const fs=a?[{k:"msg",l:"Update message",t:"area",v:a.msg}]:[{k:"ty",l:"Type",t:"sel",o:AT,v:"Code Blue"},{k:"loc",l:"Location",v:S.pid&&P.find(p=>p.id==S.pid)?P.find(p=>p.id==S.pid).bed:""},{k:"aud",l:"Send to",t:"sel",o:["My unit","Whole hospital","Charge nurse only"],v:"My unit"},{k:"msg",l:"Message",t:"area",v:""}];
form(a?"Update emergency":"Announce emergency",fs,o=>{if(!o.msg)return"Add a short message so responders know what is happening.";if(a)a.msg=o.msg;else{S.al.unshift({id:id(),ty:o.ty,loc:o.loc,msg:o.msg,aud:o.aud,by:S.me.name,t:tm(),st:"active",inc:0});beep()}},null,{})}
function beep(){try{const c=new(window.AudioContext||webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(c.currentTime+.4)}catch(e){}if(navigator.vibrate)navigator.vibrate([200,100,200])}
function incoming(){const o=[["Rapid response","Bed 5B","Tomás R. has a falling blood pressure. Rapid response team needed now.","Charge nurse M. Lopez"],["Fire","Linen room, 4 West","Smoke reported. Close doors and follow evacuation plan.","Security desk"],["Chemo spill","Infusion Suite","Spill in room 3. Keep clear and bring the spill kit.","Infusion RN T. Greene"]][Math.floor(Math.random()*3)];
S.al.unshift({id:id(),ty:o[0],loc:o[1],msg:o[2],by:o[3],t:tm(),st:"active",inc:1,aud:"My unit"});beep();ban();if(S.v=="alerts")draw()}
/* views */
const chip=p=>`<i class="chip ${ST[p.st]||"pu"}">${esc(p.st)}</i>`;
const pcard=(p,act,on)=>`<button class="pc ${on?"on":""}" data-act="${act}" data-id="${p.id}"><b>${esc(p.name)}</b><span>${esc(p.bed)}</span><span>${esc(p.dx)}</span>${chip(p)}</button>`;
const head=(t,s)=>`<div class="top"><div><h1>${t}</h1><p>${s}</p></div><div class="row" style="margin:0"><button class="btn em" data-act="announce">Announce emergency</button><button class="btn ghost" data-act="theme">Light or dark</button></div></div>`;
const note=(k,e)=>`<div class="entry"><div class="meta"><b>${esc(nm(e.p))}</b>${k=="emo"?`<i class="chip pk">${esc(e.m)}</i>`:""}${esc(e.t)} · ${esc(e.a)}${e.ed?" · edited":""}<button class="lnk" data-act="e${k}" data-id="${e.id}">Edit</button></div>${esc(e.x)}</div>`;
function ban(){$("#ban").innerHTML=S.al.filter(a=>a.st=="active").map(a=>`<div class="alert" role="alert"><div><b>${esc(a.ty)}${a.loc?" · "+esc(a.loc):""}</b><div>${esc(a.msg)}</div><small>${a.inc?"Incoming from "+esc(a.by):"You announced this to "+esc(a.aud)} at ${a.t}${a.ack?" · Acknowledged "+a.ack:""}</small></div><div class="row">${a.inc&&!a.ack?`<button data-act="ack" data-id="${a.id}">Acknowledge</button>`:""}<button data-act="res" data-id="${a.id}">Resolve</button></div></div>`).join("")}
function home(){const f=x=>!S.sel||x.p==S.sel||x.p==0,cl=S.clin.filter(f),em=S.emo.filter(f),ts=S.tasks.filter(f),g=new Date().getHours();
return head((g<12?"Good morning":g<18?"Good afternoon":"Good evening")+", "+esc(S.me.name.split(" ")[0]),"Tap a patient to focus the logs and tasks on them.")+
`<h2>Your patients</h2><div class="strip">${P.map(p=>pcard(p,"sel",S.sel==p.id)).join("")}<button class="pc add" data-act="addp">+ Add patient</button></div><div class="grid">
<section class="panel bl"><header><h3>Clinical handover</h3><button class="btn sm" data-act="aclin">Add note</button></header>${cl.map(e=>note("clin",e)).join("")||'<div class="empty">No clinical notes yet.</div>'}</section>
<section class="panel pk"><header><h3>Emotional handover</h3><button class="btn sm" data-act="aemo">Add note</button></header>${em.map(e=>note("emo",e)).join("")||'<div class="empty">No emotional notes yet.</div>'}</section>
<section class="panel ye"><header><h3>Tasks</h3><span>${ts.filter(t=>t.c).length} of ${ts.length} done</span><button class="btn sm" data-act="atask">Add task</button></header>${ts.map(t=>`<div class="task ${t.c?"done":""}"><input type="checkbox" aria-label="Done" data-act="task" data-id="${t.id}" ${t.c?"checked":""}><div><span class="t">${esc(t.x)}</span><small>${esc(nm(t.p))} · ${esc(t.d)}</small></div><button class="lnk" data-act="etask" data-id="${t.id}">Edit</button></div>`).join("")||'<div class="empty">No tasks yet.</div>'}</section></div>`}
function patients(){const p=P.find(x=>x.id==S.pid);let d='<div class="panel"><div class="empty">No patients yet. Add one to get started.</div></div>';
if(p){const fl=(n,v,t)=>v!==""&&(t=="t"?parseFloat(v)>=38:t=="anc"?parseFloat(v)<1.5:t=="hgb"?parseFloat(v)<10:t=="plt"?parseFloat(v)<100:0);
d=`<section class="panel"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div><h2>${esc(p.name)}, ${esc(p.age)}</h2><div style="color:var(--mu)">${esc(p.bed)} · ${esc(p.code)}</div>${chip(p)}</div>
<div class="row" style="margin:0;align-self:flex-start"><button class="btn sm" data-act="editp">Edit details</button><button class="btn sm ghost" data-act="movep">Move room</button><button class="btn sm danger" data-act="delp">Remove</button></div></div>
<dl class="facts"><div><dt>Diagnosis</dt><dd>${esc(p.dx)}</dd></div><div><dt>Regimen</dt><dd>${esc(p.rx)}</dd></div><div><dt>Allergies</dt><dd>${esc(p.al)}</dd></div><div><dt>Next due</dt><dd>${esc(p.due)}</dd></div></dl>
<div style="display:flex;justify-content:space-between;align-items:center"><h3>Vitals and labs</h3><button class="lnk" data-act="vitp">Update</button></div>
<div class="tiles">${[["Temp",p.v.t+" °C","t",p.v.t],["Heart rate",p.v.hr,"",""],["BP",p.v.bp,"",""],["SpO₂",p.v.sp+"%","",""],["ANC",p.l.anc,"anc",p.l.anc],["Hgb",p.l.hgb,"hgb",p.l.hgb],["Platelets",p.l.plt,"plt",p.l.plt]].map(x=>`<div class="tile ${fl(0,x[3],x[2])?"f":""}"><small>${x[0]}</small><b>${esc(x[1])}</b></div>`).join("")}</div>
<div style="display:flex;justify-content:space-between;align-items:center"><h3>Medications</h3><button class="lnk" data-act="addm">Add medication</button></div>
${p.meds.map(x=>`<div class="med"><div><b>${esc(x.n)}</b><div style="color:var(--mu);font-size:13px">${esc(x.dose)} · ${esc(x.route)} · ${esc(x.freq)}</div></div><div><i class="chip ${x.s=="Active"?"gr":x.s=="On hold"?"ye":"pk"}">${x.s}</i> <button class="lnk" data-act="em" data-id="${x.id}">Change</button></div></div>`).join("")||'<div class="empty">No medications listed.</div>'}
<h3 style="margin-top:18px">Handover notes</h3>${S.clin.filter(e=>e.p==p.id).map(e=>note("clin",e)).join("")+S.emo.filter(e=>e.p==p.id).map(e=>note("emo",e)).join("")||'<div class="empty">No notes for this patient.</div>'}
<h3 style="margin-top:18px">Change log</h3>${p.log.map(l=>`<div class="log"><b>${l.t}</b> · ${esc(l.x)}</div>`).join("")||'<div class="empty">No changes recorded yet.</div>'}</section>`}
return head("Patient list","Edit details, rooms and medications. Every change is logged.")+`<div class="split"><div class="plist">${P.map(q=>pcard(q,"pick",q.id==S.pid)).join("")}<button class="pc add" data-act="addp">+ Add patient</button></div>${d}</div>`}
function profile(){const me=S.me,ini=me.name.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase(),days=Object.keys(me.notes).sort().reverse();
return head("Nurse profile","Your details, shift and daily notes.")+`<div class="grid">
<section class="panel"><div style="display:flex;gap:14px;align-items:center"><div class="avatar">${esc(ini)}</div><div><h2>${esc(me.name)}</h2><div style="color:var(--mu)">@${esc(me.user)} · ${esc(me.role)}</div></div></div>
<dl class="facts"><div><dt>Unit</dt><dd>${esc(me.unit)}</dd></div><div><dt>Contact</dt><dd>${esc(me.phone)}</dd></div><div><dt>Experience</dt><dd>${esc(me.exp)}</dd></div></dl><div class="row" style="margin:0"><button class="btn" data-act="meF">Edit profile</button><button class="btn ghost" data-act="logout">Sign out</button></div></section>
<section class="panel pu"><header><h3>Shift countdown</h3><button class="btn sm" data-act="shiftF">Change shift</button></header><div style="color:var(--mu)" data-cdl></div><div class="big" data-cd>0:00:00</div><div class="bar"><i data-bar></i></div><div style="display:flex;justify-content:space-between;color:var(--mu);font-size:13px"><span>${S.sh.s}</span><span>${esc(S.sh.type.split(" (")[0])}</span><span>${S.sh.e}</span></div></section>
<section class="panel gr"><header><h3>Certificates</h3><button class="btn sm" data-act="addc">Add</button></header>${me.certs.map(c=>{const d=c.exp?(new Date(c.exp)-new Date())/864e5:999;return`<div class="med"><div><b>${esc(c.n)}</b><div style="color:var(--mu);font-size:13px">${c.exp?"Expires "+esc(c.exp):"No expiry set"}</div></div><div>${d<0?'<i class="chip pk">Expired</i>':d<90?'<i class="chip ye">Renew soon</i>':""} <button class="lnk" data-act="ec" data-id="${c.id}">Edit</button></div></div>`}).join("")||'<div class="empty">No certificates added.</div>'}</section>
<section class="panel ye"><header><h3>Daily notes</h3></header><label for="dd" style="margin-top:0">Day</label><input id="dd" type="date" value="${S.nd}" data-chg="nd"><label for="dt">Note for this day</label><textarea id="dt" placeholder="Personal reminders, learning, things to follow up">${esc(me.notes[S.nd]||"")}</textarea>
<div class="row" style="margin-top:10px"><button class="btn" data-act="savedn">Save note</button>${me.notes[S.nd]?'<button class="btn danger" data-act="deldn">Delete note</button>':""}</div>
${days.length?'<h3 style="margin-top:16px">Saved days</h3>'+days.map(d=>`<div class="log"><button class="lnk" data-act="goday" data-d="${d}">${d}</button> · ${esc(me.notes[d].slice(0,60))}</div>`).join(""):""}</section></div>`}
function alerts(){const A=S.al.filter(a=>a.st=="active"),R=S.al.filter(a=>a.st!="active");
return head("Emergency alerts","Announce an emergency or respond to one sent to you.")+`<div class="row" style="margin:0 0 16px"><button class="btn em" data-act="announce">Announce emergency</button><button class="btn ghost" data-act="sim">Simulate incoming alert</button></div><div class="grid">
<section class="panel pk"><header><h3>Active</h3><span>${A.length}</span></header>${A.map(a=>`<div class="entry"><b>${esc(a.ty)}${a.loc?" · "+esc(a.loc):""}</b><div>${esc(a.msg)}</div><div class="meta">${a.inc?"From "+esc(a.by):"Sent by you to "+esc(a.aud)} · ${a.t}<button class="lnk" data-act="ea" data-id="${a.id}">Update</button></div></div>`).join("")||'<div class="empty">No active emergencies.</div>'}</section>
<section class="panel"><header><h3>History</h3><span>${R.length}</span></header>${R.map(a=>`<div class="entry"><b>${esc(a.ty)}${a.loc?" · "+esc(a.loc):""}</b><div>${esc(a.msg)}</div><div class="meta">${a.inc?"From "+esc(a.by):"Sent by you"} · ${a.t} · resolved ${a.rt}<button class="lnk" data-act="da" data-id="${a.id}">Delete</button></div></div>`).join("")||'<div class="empty">Resolved alerts appear here.</div>'}</section></div>`}
function draw(){$("#view").innerHTML=({home,patients,profile,alerts})[S.v]();document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("on",b.dataset.v==S.v));ban();tick()}
const cur=()=>P.find(p=>p.id==S.pid),byId=(a,i)=>a.find(x=>x.id==i);
const H={
login(){const u=$("#em").value.trim();if(!u||!$("#pw").value){$("#err").textContent="Enter your username and password to sign in.";return}S.me.user=u;S.me.unit=$("#un").value;$("#login").classList.add("hide");$("#app").classList.remove("hide");draw()},
logout(){$("#app").classList.add("hide");$("#login").classList.remove("hide");$("#pw").value=""},
nav(b){S.v=b.dataset.v;draw()},sel(b,i){S.sel=S.sel==i?null:i;draw()},pick(b,i){S.pid=i;draw()},
theme(){const r=document.documentElement,d=matchMedia("(prefers-color-scheme:dark)").matches,c=r.dataset.theme||(d?"dark":"light");r.dataset.theme=c=="dark"?"light":"dark"},
addp:addP,editp(){editP(cur())},vitp(){vitals(cur())},movep(){moveP(cur())},delp(){delP(cur())},addm(){medF(cur())},em(b,i){medF(cur(),byId(cur().meds,i))},
aclin(){noteF("clin")},aemo(){noteF("emo")},eclin(b,i){noteF("clin",byId(S.clin,i))},eemo(b,i){noteF("emo",byId(S.emo,i))},
atask(){taskF()},etask(b,i){taskF(byId(S.tasks,i))},task(b,i){const t=byId(S.tasks,i);t.c=b.checked?1:0;draw()},
meF,shiftF,addc(){certF()},ec(b,i){certF(byId(S.me.certs,i))},
savedn(){const v=$("#dt").value.trim();if(v)S.me.notes[S.nd]=v;else delete S.me.notes[S.nd];draw()},deldn(){delete S.me.notes[S.nd];draw()},goday(b){S.nd=b.dataset.d;draw()},
announce(){alertF()},sim:incoming,ea(b,i){alertF(byId(S.al,i))},da(b,i){S.al=S.al.filter(a=>a.id!=i);draw()},
ack(b,i){byId(S.al,i).ack=tm();ban();if(S.v=="alerts")draw()},res(b,i){const a=byId(S.al,i);a.st="resolved";a.rt=tm();draw()},
mcancel(){closeM()},
msave(){const o={};M.fs.forEach(f=>o[f.k]=$("#f_"+f.k).value.trim());const r=M.save(o);if(r){$("#merr").textContent=r;return}closeM()},
mdel(b){if(!M.cf){M.cf=1;b.textContent="Tap again to confirm";return}M.del();closeM()}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const f=H[b.dataset.act];if(f&&b.type!="checkbox")f(b,+b.dataset.id)});
document.addEventListener("change",e=>{const b=e.target;if(b.dataset.act=="task")H.task(b,+b.dataset.id);if(b.dataset.chg=="nd"&&b.value){S.nd=b.value;draw()}});
document.addEventListener("keydown",e=>{if(e.key=="Escape"&&M)closeM();if(e.key=="Enter"&&!$("#login").classList.contains("hide"))H.login()});
setInterval(tick,1000);
</script>
